[package]
name = "kompress-super-ultra"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Peter Jozsef Lodri <peter@8b.is>"]
description = "Headroom + Kompress-Super-Ultra CORE with 4-role semantic folding, live WebSocket WebUI, and exact p/q rational accounting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/8b-is/kompress-super-ultra"

[lib]
name = "kompress_super_ultra"
path = "src/lib.rs"

[[bin]]
name = "kompress-super-ultra"
path = "src/main.rs"

[[bench]]
name = "benchmark"
harness = false

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
regex = "1.13.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
